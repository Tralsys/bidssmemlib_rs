name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo check

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        # On Linux, Windows-specific tests and interop tests are automatically
        # skipped via #[cfg(windows)].

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        # This runs all tests including Windows-specific shared memory tests.
        # Interop tests are excluded here (they need dotnet and are run separately).

  interop-test:
    name: C# Interop (Windows)
    runs-on: windows-latest
    needs: [test-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build C# interop test project
        run: dotnet build tests/csharp_interop/InteropTest.csproj -c Release
      - name: Run interop tests
        run: cargo test --test interop_test -- --test-threads=1
